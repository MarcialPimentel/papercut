# After CI passes on main, takes the Docker image CI already built (tagged with the commit SHA),
# marks it :latest, and has the hub server switch to it:
#   1. keep the running build as :previous
#   2. start the new build
#   3. wait for it to report healthy; if it never does, switch back to :previous and fail the run
#   4. check https://papercut.marz.gg/api/health from outside reports this build
#
# Run it by hand from the Actions tab (Deploy -> Run workflow) to redeploy main,
# or give it a commit from main to roll back to that build.
#
# Needs the one-time hub setup in docs/deploy.md, and two repo secrets
# (Settings -> Secrets and variables -> Actions): DROPLET_HOST and DROPLET_SSH_KEY.
# Until those secrets exist, this workflow skips with a warning instead of failing.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Roll back: a commit from main to deploy (short or full SHA). Leave empty to deploy the latest main.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/marcialpimentel/papercut
  SITE: https://papercut.marz.gg

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check the hub secrets are set
        id: ready
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::warning::Not deployed: the DROPLET_HOST and DROPLET_SSH_KEY secrets aren't set yet. See docs/deploy.md, step 3."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Work out which build to deploy
        if: steps.ready.outputs.ok == 'true'
        id: pick
        env:
          REQUESTED: ${{ inputs.commit }}
          DEFAULT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$DEFAULT_SHA
          if [ -n "$REQUESTED" ]; then
            sha=$(git rev-parse --verify --quiet "$REQUESTED^{commit}") || { echo "::error::No commit $REQUESTED in this repo."; exit 1; }
            git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$REQUESTED is not on main. Only builds from main can go live."; exit 1; }
            echo "Rolling back to $(git log -1 --format='%h %s' "$sha")"
          fi
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            passed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --status success --json databaseId -q 'length')
            [ "$passed" -gt 0 ] || { echo "::error::CI never passed on ${sha:0:7}, so it can't go live."; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.ready.outputs.ok == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark the build as latest
        if: steps.ready.outputs.ok == 'true'
        run: |
          docker manifest inspect "$IMAGE:${{ steps.pick.outputs.sha }}" > /dev/null 2>&1 || { echo "::error::There is no saved build for this commit. Pick a commit from main that CI built."; exit 1; }
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${{ steps.pick.outputs.sha }}"

      - name: Switch builds on the hub, check health (rolls back on failure)
        if: steps.ready.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ steps.pick.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: IMAGE,DEPLOY_SHA,GHCR_USER,GHCR_TOKEN
          command_timeout: 10m
          # Written to a file and run from there, so no command can swallow the rest of the script.
          script: |
            script=$(mktemp)
            cat > "$script" <<'REMOTE'
            cd /opt/hub
            short=${DEPLOY_SHA:0:7}
            grep -q '^  papercut:' docker-compose.yml || { echo "::error::The hub has no papercut service yet. Do the one-time setup in docs/deploy.md (step 2)."; exit 1; }

            echo "==> 1/3 Keeping the running build as :previous"
            has_previous=0
            running=$(docker compose ps -q papercut || true)
            if [ -n "$running" ]; then
              docker tag "$(docker inspect --format '{{.Image}}' "$running")" "$IMAGE:previous"
              has_previous=1
            fi

            echo "==> 2/3 Starting build $short"
            # The image may be private: log in just for this pull, then log out again.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin > /dev/null
            pulled=0
            docker pull -q "$IMAGE:$DEPLOY_SHA" && pulled=1
            docker logout ghcr.io > /dev/null
            [ "$pulled" = 1 ] || { echo "::error::Could not download build $short."; exit 1; }
            docker tag "$IMAGE:$DEPLOY_SHA" "$IMAGE:latest"
            docker image rm "$IMAGE:$DEPLOY_SHA" > /dev/null
            docker compose up -d papercut

            wait_healthy() {
              for _ in $(seq 1 24); do   # up to 2 minutes
                id=$(docker compose ps -q papercut || true)
                status=missing
                [ -n "$id" ] && status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$id")
                [ "$status" = healthy ] && return 0
                sleep 5
              done
              echo "Last status: $status"
              return 1
            }

            echo "==> 3/3 Waiting for the game to report healthy"
            if wait_healthy; then
              echo "Build $short is live and healthy."
              docker image prune -f > /dev/null
              exit 0
            fi

            echo "::error::Build $short never became healthy. Its last log lines:"
            docker compose logs --no-color --tail 60 papercut || true
            if [ "$has_previous" = 1 ]; then
              echo "==> Rolling back to the build that was running before"
              docker tag "$IMAGE:previous" "$IMAGE:latest"
              docker compose up -d papercut
              if wait_healthy; then echo "::error::Rolled back: the previous build is running again. Build $short is NOT live."
              else echo "::error::The previous build is not healthy either. The game may be down: check the server."; fi
            fi
            exit 1
            REMOTE
            rc=0
            bash -euo pipefail "$script" < /dev/null || rc=$?
            rm -f "$script"
            exit "$rc"

      - name: Check the live site runs this build
        if: steps.ready.outputs.ok == 'true'
        env:
          WANT: ${{ steps.pick.outputs.sha }}
        run: |
          want=${WANT:0:7}
          for _ in $(seq 1 12); do
            got=$(curl -fsS -m 10 "$SITE/api/health" | sed -n 's/.*"build":"\([^"]*\)".*/\1/p' || true)
            if [ "$got" = "$want" ]; then echo "$SITE is live on build $got"; exit 0; fi
            sleep 5
          done
          echo "::error::$SITE/api/health reports build '${got:-nothing}', expected $want."
          exit 1
